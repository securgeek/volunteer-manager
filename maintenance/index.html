<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Back soon – BSidesCharm Volunteers</title>
  <!-- Served by compose.maintenance.yml while the real stack is down, so everything it needs
       is in maintenance/: no app, no API, nothing from another site. The look is
       bsidescharm.org's, as frontend/src/assets/portal-theme.css has it.
       Per conference, by hand: logo.webp, the <title>, the logo's link and alt text, and the
       footer links. It can't read App Settings, since nothing else is running. -->
  <style>
    @font-face { font-family: 'Montserrat'; font-weight: 600; font-display: swap;
                 src: url(/__maintenance/fonts/montserrat-latin-600-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Source Sans 3'; font-weight: 400; font-display: swap;
                 src: url(/__maintenance/fonts/source-sans-3-latin-400-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Source Sans 3'; font-weight: 600; font-display: swap;
                 src: url(/__maintenance/fonts/source-sans-3-latin-600-normal.woff2) format('woff2'); }

    :root {
      --blue: #0274be; --ink: #4b4f58; --heading: #3a3a3a;
      --header-bg: #f6f6f6; --band-bg: #4b4f58; --band-ink: #f2f5f7;
      --panel-bg: #f2f5f7; --footer-bg: #3a3a3a;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: #ffffff; color: var(--ink);
      font: 400 17px/1.6 'Source Sans 3', 'Source Sans Pro', system-ui, sans-serif;
    }
    .inner { width: 100%; max-width: 60rem; margin: 0 auto; padding: 0 1rem; }
    header { background: var(--header-bg); }
    header .inner { display: flex; align-items: center; min-height: 5rem; }
    header img { height: 4rem; width: auto; padding: 0.5rem 0; }
    .band { background: var(--band-bg); }
    .band h1 {
      margin: 0 auto; padding: 1.75rem 1rem; text-align: center; color: var(--band-ink);
      font: 600 1.6rem/1.15 'Montserrat', system-ui, sans-serif;
    }
    main { flex: 1; padding: 3rem 0; }
    .panel {
      max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.75rem;
      background: var(--panel-bg); border: 1px solid var(--blue); border-radius: 2px;
    }
    .panel h2 {
      margin: 0 0 0.75rem; color: var(--heading);
      font: 600 1.4rem/1.2 'Montserrat', system-ui, sans-serif;
    }
    .panel p { margin: 0.75rem 0 0; }
    a { color: var(--blue); }
    footer { background: var(--footer-bg); color: #e6e6e6; font-size: 0.85rem;
             text-align: center; padding: 1.25rem 0; }
    footer a { color: #6cb8ea; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <a href="https://bsidescharm.org/"><img src="/__maintenance/logo.webp" alt="BSidesCharm"
         width="300" height="280"></a>
    </div>
  </header>

  <div class="band"><h1 class="inner">Volunteers</h1></div>

  <main>
    <div class="inner">
      <div class="panel">
        <h2>We'll be right back</h2>
        <p>The volunteer site is undergoing maintenance. Please check back in a few minutes.</p>
        <p>Your registration and shifts are safe; nothing you've entered is affected.</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="inner">
      <a href="https://bsidescharm.org/">BSidesCharm</a>
      · <a href="https://bsidescharm.org/codeofconduct">Code of Conduct</a>
    </div>
  </footer>
</body>
</html>
