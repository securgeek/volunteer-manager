# The maintenance stack (compose.maintenance.yml): one server on both of the real frontend's
# ports, so the tunnel needs no change. Every request gets the maintenance page as a 503;
# the page's own logo and fonts are the only thing served with a 200.
#
# 503 + Retry-After says "temporary" to the edge, browsers and crawlers. no-store keeps
# anyone from being handed a cached maintenance page once the site is back.

server {
    listen 8080;
    listen 8082;
    server_name localhost;
    absolute_redirect off;

    error_page 503 /__maintenance/page;

    # add_header isn't inherited into a location that sets its own, so each one says it all.
    location = /__maintenance/page {
        internal;
        default_type text/html;
        add_header Retry-After   300        always;
        add_header Cache-Control "no-store" always;
        alias /usr/share/maintenance/index.html;
    }

    location = /__maintenance/logo.webp {
        add_header Cache-Control "max-age=300" always;
        alias /usr/share/maintenance/logo.webp;
    }

    location ^~ /__maintenance/fonts/ {
        add_header Cache-Control "max-age=300" always;
        alias /usr/share/maintenance/fonts/;
    }

    # An open admin page or signup form gets an error it can show, not HTML it can't parse:
    # the app reads FastAPI's {"detail": ...}.
    location ^~ /api/ {
        default_type application/json;
        add_header Retry-After   300        always;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"The site is undergoing maintenance. Please try again in a few minutes."}';
    }

    location / {
        return 503;
    }
}
