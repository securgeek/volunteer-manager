# Two sites from one build, one server block each. Both are plain HTTP on loopback-only host
# publishes (compose.yml); the edge terminates TLS and a tunnel client on the host dials them:
#
#   8080  the full site — /admin, the organizer API, and the volunteer pages too. Published as
#         FRONTEND_PORT; its public hostname (ADMIN_PUBLIC_URL) sits behind the edge's access gate.
#   8082  the volunteer portal only — /, /apply/, static assets and /api/portal/*. Published
#         as PORTAL_SITE_PORT; its hostname (PORTAL_PUBLIC_URL) is public.
#
# Client IP, both servers. The edge sets the header named in real_ip_header to the real client
# and overwrites any copy the client sent, so it is a single trustworthy value. X-Forwarded-For
# is not: the edge *appends* to it, keeping whatever the client put in front. A different edge
# needs its own header here. The trusted sources are wherever the tunnel client's connection
# appears from after podman's port forward
# (loopback, or the network gateway) — only the host and the compose containers can reach
# these ports, so a forged header can only come from inside the box. GET /whoami on 8080
# shows what nginx resolved.
#
# NGINX_LOCAL_RESOLVERS is filled in at container start from /etc/resolv.conf by the nginx
# image's entrypoint (see Dockerfile), for the variable upstreams below. Never hardcode it:
# Docker's embedded DNS is 127.0.0.11, podman's aardvark-dns is the network gateway.
#
# Upstreams are variables, so nginx resolves them per request: it starts when backend or
# portal is absent (those requests 502 instead of the whole site failing to boot) and follows
# a recreated container to its new address. With a variable and no URI part, nginx forwards
# the original request URI.
#
# Each proxy sends X-Forwarded-For as one resolved value, not $proxy_add_x_forwarded_for: the
# backend reads the leftmost entry and the portal the rightmost (portal/CLAUDE.md, auth
# invariant 3), and with a single entry both are the client nginx resolved.

# ── Full site (organizers) ────────────────────────────────────────────────────
server {
    listen 8080;
    server_name localhost;

    # Relative Location headers. nginx would otherwise build them from its own scheme and
    # port, sending browsers to http://<host>:8080/... behind the tunnel.
    absolute_redirect off;

    set_real_ip_from  127.0.0.1;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    CF-Connecting-IP;

    resolver ${NGINX_LOCAL_RESOLVERS} ipv6=off valid=10s;

    # The landing page is the public portal's; organizers here go straight to the sign-in.
    # Landing.vue does the same for in-app navigation to /, which never reaches nginx.
    location = / {
        return 302 /admin;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Probe for confirming what the tunnel actually sends: the resolved client address and
    # the raw headers, so a forged value is visible.
    location = /whoami {
        default_type text/plain;
        return 200 "remote_addr=$remote_addr cf_connecting_ip=$http_cf_connecting_ip xff=$http_x_forwarded_for\n";
    }

    # The volunteer portal's API. Longest prefix wins, so this takes /api/portal/* ahead of
    # the backend route below.
    location /api/portal {
        set $portal_upstream portal:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://$portal_upstream;
    }

    # The two logo uploads (backend routers/setup.py, MAX_LOGO_BYTES = 2 MB) plus the favicon
    # field and multipart overhead. Everything else keeps nginx's 1 MB default. A regex
    # location wins over the /api prefix below; same proxying as there.
    location ~ ^/api/app_(header_)?logo$ {
        client_max_body_size 3m;
        set $backend_upstream backend:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://$backend_upstream;
    }

    location /api {
        set $backend_upstream backend:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://$backend_upstream;
    }
}

# ── Volunteer portal only (public) ────────────────────────────────────────────
# Nothing here reaches the backend. The portal's /api/sync/* is outside /api/portal/, so the
# scheduler-to-portal channel isn't reachable either.
server {
    listen 8082;
    server_name localhost;

    # Relative Location headers. nginx would otherwise build them from its own scheme and
    # port, sending browsers to http://<host>:8080/... behind the tunnel.
    absolute_redirect off;

    set_real_ip_from  127.0.0.1;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    CF-Connecting-IP;

    resolver ${NGINX_LOCAL_RESOLVERS} ipv6=off valid=10s;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # The organizer app and its API live on the other hostname. A bare 404 rather than the
    # SPA: Landing.vue reads a 404 from /api/setup_status as "no admin here" and hides its
    # Admin Login item. ^~ so the regex-free prefix wins outright.
    location ^~ /admin {
        return 404;
    }
    location ^~ /api {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }

    # Trailing slash: /api/portalX must not get past the 404 above.
    location ^~ /api/portal/ {
        set $portal_upstream portal:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://$portal_upstream;
    }
}
