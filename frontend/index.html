<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script>
      // Theme before first paint, so neither side flashes the other's colors. router.js
      // keeps it right on in-app navigation (portal_theme).
      document.documentElement.classList.add(
        location.pathname.startsWith('/admin') ? 'dark-app' : 'bsc-portal')
    </script>
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Scheduler</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
