# The maintenance page, for while the real stack is down. A separate compose project (name:
# below), so `podman-compose down` of either never touches the other. It publishes the same
# loopback ports as the real frontend, read from the same .env, so the tunnel needs no
# change — which also means the two can't run at once. Use ./maintenance.sh on|off.
#
# Everything it serves is in maintenance/ (page, logo, fonts), mounted read-only; it has no
# network route to anything in the main stack.
name: bsides-maintenance

services:
  maintenance:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
      - "127.0.0.1:${PORTAL_SITE_PORT:-8082}:8082"
    volumes:
      - ./maintenance/default.conf:/etc/nginx/conf.d/default.conf:z,ro
      - ./maintenance:/usr/share/maintenance:z,ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    # nginx starts as root, then drops its workers to the nginx user.
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    # Fast shutdown: nothing here holds a connection worth waiting for.
    stop_signal: SIGTERM
